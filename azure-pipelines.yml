trigger:
  branches:
    include:
      - main

variables:
  ACR_LOGIN_SERVER: acrkubedashboardsystem.azurecr.io
  BACKEND_IMAGE: acrkubedashboardsystem.azurecr.io/backend
  FRONTEND_IMAGE: acrkubedashboardsystem.azurecr.io/frontend

stages:

  - stage: Build
    displayName: Build and Push Images
    jobs:
      - job: BuildBackend
        displayName: Build Backend
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push backend
            inputs:
              containerRegistry: acr-connection-kube-dashboard-system
              repository: backend
              command: buildAndPush
              dockerfile: backend/Dockerfile
              context: backend
              tags: |
                latest
                $(Build.BuildId)

      - job: BuildFrontend
        displayName: Build Frontend
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push frontend
            inputs:
              containerRegistry: acr-connection-kube-dashboard-system # service connection a traves de devops
              repository: frontend
              command: buildAndPush
              dockerfile: frontend/Dockerfile
              context: frontend
              buildArguments: VITE_API_URL=/api
              tags: |
                latest
                $(Build.BuildId)

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    jobs:
      - job: DeployToAKS
        displayName: Deploy
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: KubernetesManifest@1
            displayName: Apply secret
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: aks-connection-kube-dashboard-system # service connection a traves de devops
              namespace: default
              manifests: k8s/secret.yaml

          - task: KubernetesManifest@1
            displayName: Deploy backend
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: aks-connection
              namespace: default
              manifests: k8s/backend-deployment.yaml
              containers: $(BACKEND_IMAGE):$(Build.BuildId)

          - task: KubernetesManifest@1
            displayName: Deploy frontend
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: aks-connection
              namespace: default
              manifests: k8s/frontend-deployment.yaml
              containers: $(FRONTEND_IMAGE):$(Build.BuildId)